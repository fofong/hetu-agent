name: cla
# 自托管 CLA 签署通道（零外部 bot）：签署语句评论 → 记录签名 → PR 状态检查 `cla`。
# 安全：只运行基线分支的脚本（pull_request_target / issue_comment 均检出 base），
# 不执行 PR 代码；签名文件是唯一状态。
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          PR_JSON: ${{ toJSON(github.event.pull_request) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          SIG=docs/cla-signatures.json
          if [ "$EVENT" = "pull_request_target" ]; then
            PR=$(echo "$PR_JSON" | jq -r .number)
            AUTHOR=$(echo "$PR_JSON" | jq -r .user.login)
            SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          else
            IS_PR=$(echo "$ISSUE_JSON" | jq -r 'has("pull_request")')
            if [ "$IS_PR" != "true" ]; then echo "not a PR comment"; exit 0; fi
            PR=$(echo "$ISSUE_JSON" | jq -r .number)
            AUTHOR=$(gh api "repos/{owner}/{repo}/pulls/$PR" --jq .user.login)
            SHA=$(gh api "repos/{owner}/{repo}/pulls/$PR" --jq .head.sha)
            if [ "$COMMENTER" = "$AUTHOR" ] && printf '%s' "$COMMENT_BODY" > /tmp/body.txt \
               && python3 scripts/cla_check.py parse --body-file /tmp/body.txt \
                    --login "$COMMENTER" --pr-author "$AUTHOR"; then
              python3 scripts/cla_check.py add --signatures "$SIG" \
                --login "$COMMENTER" --comment-url "$COMMENT_ID"
              git config user.name "hetu-cla-bot"
              git config user.email "cla-bot@users.noreply.github.com"
              git add "$SIG"
              git commit -m "cla: signature from $COMMENTER (PR #$PR)"
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          python3 scripts/cla_check.py check --login "$AUTHOR" \
            --signatures "$SIG" --owner "${{ github.repository_owner }}" \
            && STATE=success || STATE=failure
          gh api "repos/{owner}/{repo}/statuses/$SHA" \
            -f state="$STATE" -f context=cla \
            -f description="$(python3 scripts/cla_check.py check --login "$AUTHOR" \
                 --signatures "$SIG" --owner "${{ github.repository_owner }}" | head -c 140)" \
            || true
          [ "$STATE" = success ]
