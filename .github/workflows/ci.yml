name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) 不再提供 3.9 构建，3.9 钉在 ubuntu-24.04
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit & mechanism experiments (47+ 反例驱动)
        run: python -m unittest discover -s tests -v
      - name: Isolation check (与旧 Hasu/Hermes 严格区别)
        run: python scripts/isolation_check.py
      - name: Kernel self-check
        run: python -m hetu status
      - name: Regenerate evidence (禁自报绿)
        run: python scripts/run_experiments.py
      - name: Fail if evidence shows red
        run: python -c "import json,sys; d=json.load(open('docs/evidence/evidence.json')); sys.exit(0 if d['all_green'] else 1)"
